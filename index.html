:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone-width app column with a sticky top bar and a fixed bottom tab bar; views swap by hash */
:root{
  --bg:#F6F4EC; --surface:#FFFFFF; --surface-2:#EEF4EA; --ink:#1C2A22; --muted:#5B6A60; --line:#DCE5D8;
  --deep:#17462F; --green:#2E8B4E; --lime:#B7DC74; --amber:#E9A23B; --rust:#C8572E; --sky:#4E9FC9;
  --on-deep:#FFFFFF; --amber-soft:#FFF3DC; --rust-soft:#FBE7DF; --sky-soft:#E3F0F7;
  --display:"Poppins", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1A14; --surface:#16241C; --surface-2:#1C2F23; --ink:#E7EFE8; --muted:#9DB0A3; --line:#2A3D31;
  --deep:#1F5C3D; --green:#4FB06F; --lime:#B7DC74; --amber:#F0B356; --rust:#E07A52; --sky:#6DB6DD;
  --on-deep:#FFFFFF; --amber-soft:#2E2617; --rust-soft:#33201A; --sky-soft:#172A35; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1A14; --surface:#16241C; --surface-2:#1C2F23; --ink:#E7EFE8; --muted:#9DB0A3; --line:#2A3D31;
  --deep:#1F5C3D; --green:#4FB06F; --lime:#B7DC74; --amber:#F0B356; --rust:#E07A52; --sky:#6DB6DD;
  --on-deep:#FFFFFF; --amber-soft:#2E2617; --rust-soft:#33201A; --sky-soft:#172A35; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);color:var(--on-deep)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;text-decoration:none;color:var(--on-deep)}
.brand em{font-style:normal;color:var(--lime)}
.brand small{font-weight:500;font-size:14px;opacity:.85}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px}
.lang button{border:0;background:transparent;color:var(--on-deep);font-size:12px;font-weight:600;padding:4px 10px;border-radius:16px}
.lang button[aria-pressed="true"]{background:var(--lime);color:#17462F}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--green)}
.nav a.scanbtn span.ring{width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;color:#17462F;box-shadow:0 4px 12px rgba(23,70,47,.25);border:3px solid var(--surface)}
.nav a.scanbtn[aria-current="page"]{color:var(--amber)}

/* generic */
.view{display:flex;flex-direction:column;gap:16px;padding-block:18px 8px}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.h1{font-size:24px;color:var(--ink)}
.lede{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;text-decoration:none;min-height:46px}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:#17462F}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
label.f span.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px}
textarea{min-height:84px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.high{background:var(--rust-soft);color:var(--rust)}
.pill.medium,.pill.moderate{background:var(--amber-soft);color:#9A5E0B}
.pill.low{background:var(--surface-2);color:var(--green)}
:root[data-theme="dark"] .pill.medium,:root[data-theme="dark"] .pill.moderate{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.medium,:root:not([data-theme="light"]) .pill.moderate{color:var(--amber)}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--green)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;font-size:13.5px}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}
.note.warn{background:var(--amber-soft)} .note.warn svg{color:var(--amber)}
.note.info{background:var(--sky-soft)} .note.info svg{color:var(--sky)}
.note.ok{background:var(--surface-2)} .note.ok svg{color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title h2{font-size:17px}
.sec-title a{font-size:13px;font-weight:600;color:var(--green);text-decoration:none}

/* hero */
.hero{background:var(--deep);color:#fff;border-radius:22px;overflow:hidden;position:relative}
.hero .copy{padding:20px 20px 0;position:relative;z-index:1}
.hero h1{font-size:27px;line-height:1.12}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{margin:8px 0 14px;opacity:.85;font-size:14px;max-width:34ch}
.hero .cta{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px;position:relative;z-index:1}
.hero .cta .btn{flex:1 1 140px}
.hero .cta .btn.ghostd{background:rgba(255,255,255,.12);color:#fff}
.hero svg.art{display:block;width:100%;height:auto;margin-top:-6px}

/* journey stepper */
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;counter-reset:j}
.jstep{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.jstep .dot{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);border:2px solid var(--line);z-index:1}
.jstep .dot svg{width:19px;height:19px}
.jstep:not(:last-child)::after{content:"";position:absolute;top:19px;left:calc(50% + 22px);right:calc(-50% + 22px);height:2px;background:var(--line)}
.jstep.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.jstep.done:not(:last-child)::after{background:var(--green)}
.jstep.now .dot{background:var(--amber);border-color:var(--amber);color:#17462F}
.jstep.done,.jstep.now{color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.tile .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--display);font-size:15px}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}

/* season */
.season-now{border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;color:#fff}
.season-now svg{width:46px;height:46px;flex:none}
.season-now b{font-family:var(--display);font-size:18px;display:block}
.season-now span{font-size:13px;opacity:.9}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:4px}
.months div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-weight:600}
.months i{display:block;width:100%;height:10px;border-radius:3px}
.months div.cur{color:var(--ink)}
.months div.cur i{outline:2px solid var(--ink);outline-offset:1px}

/* scan */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{position:relative;border:2px dashed var(--line);border-radius:18px;background:var(--surface);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;cursor:pointer;overflow:hidden}
.drop.has{border-style:solid;padding:0}
.drop img{width:100%;max-height:320px;object-fit:cover;display:block}
.drop .ph{width:58px;height:58px;border-radius:18px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center}
.drop .ph svg{width:30px;height:30px}
.drop .corner{position:absolute;width:26px;height:26px;border:3px solid var(--amber)}
.drop .c1{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.drop .c2{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.drop .c3{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.drop .c4{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.drop .change-row{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.drop .change{display:inline-flex;align-items:center;gap:5px;background:rgba(23,70,47,.88);color:#fff;border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.drop .change svg{width:15px;height:15px}
.drop .pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.drop .pick .btn{cursor:pointer}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* result */
.res-head{display:flex;gap:12px;align-items:flex-start}
.res-head img{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none}
.res-head .t{min-width:0}
.ph-thumb{width:76px;height:76px;border-radius:14px;flex:none;background:var(--surface-2);color:var(--green);display:flex;align-items:center;justify-content:center}
.ph-thumb svg{width:32px;height:32px}
.res-head h2{font-size:19px}
.cause{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cause .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cause b{font-family:var(--display);font-size:15.5px}
.cause .type{font-size:12px;color:var(--muted);text-transform:capitalize}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.thinking{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 16px;text-align:center}
.scanline{width:120px;height:120px;border-radius:22px;background:var(--surface-2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--green)}
.scanline svg{width:58px;height:58px}
.scanline::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--amber);top:0;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.scanline::after{animation:none;top:50%}}
.steps7{display:flex;flex-direction:column;gap:0}
.s7{display:flex;gap:12px;position:relative;padding-bottom:12px}
.s7:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--amber-soft)}
.s7 .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--amber);color:#17462F;font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.s7 b{font-family:var(--display);font-size:14.5px;display:block}
.s7 p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* cases */
.case{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink)}
.case .th{width:56px;height:56px;border-radius:12px;flex:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--green)}
.case .th img{width:100%;height:100%;object-fit:cover}
.case .th svg{width:26px;height:26px}
.case .mid{flex:1;min-width:0}
.case .mid b{display:block;font-family:var(--display);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case .mid span{font-size:12.5px;color:var(--muted)}
.status{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.status.due{background:var(--amber-soft);color:#9A5E0B}
.status.open{background:var(--sky-soft);color:var(--sky)}
.status.done{background:var(--surface-2);color:var(--green)}
.status.ex{background:var(--surface-2);color:var(--muted)}
:root[data-theme="dark"] .status.due{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .status.due{color:var(--amber)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a.wait{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-block:10px 4px}
.composer textarea{min-height:46px;height:46px;border-radius:23px;padding:12px 16px}
.composer .btn{border-radius:50%;width:46px;padding:0;flex:none}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.footer-note{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.ex-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amber-soft);color:#9A5E0B;border-radius:6px;padding:2px 7px}
:root[data-theme="dark"] .ex-tag{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex-tag{color:var(--amber)}}

/* ---------- v2 additions: weather, records, experts, guides, voice ---------- */
.subtabs{display:flex;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px;overflow-x:auto}
.subtabs a,.subtabs button{flex:1 0 auto;text-align:center;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.subtabs [aria-current="page"],.subtabs [aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.alert-card{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.alert-card .ai{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.alert-card .ai svg{width:20px;height:20px}
.alert-card b{font-family:var(--display);font-size:14.5px;display:block}
.alert-card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.alert-card.warning{border-color:var(--rust);background:var(--rust-soft)}
.alert-card.warning .ai{background:var(--rust)}
.alert-card.watch .ai{background:var(--amber);color:#17462F}
.alert-card.pest .ai{background:var(--deep)}
.alerts{display:flex;flex-direction:column;gap:8px}
.wx-now{background:linear-gradient(160deg,var(--sky),#2F7FA8);color:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.wx-now .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.wx-now .wico{width:60px;height:60px}
.wx-now .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;font-size:13px;opacity:.95}
.wx-now .place{font-size:13px;opacity:.9}
.wx-days{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.wx-day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center}
.wx-day b{font-family:var(--display);font-size:12.5px}
.wx-day svg{width:26px;height:26px;color:var(--sky)}
.wx-day .t{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.wx-day .r{color:var(--sky);font-weight:600;font-variant-numeric:tabular-nums}
.wx-day.heavy{border-color:var(--sky);background:var(--sky-soft)}
.rainchart{width:100%;height:auto;display:block}
.rainchart text{fill:var(--muted);font-family:var(--body);font-size:10px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat.pos .n{color:var(--green)} .stat.neg .n{color:var(--rust)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}}
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .ri{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.rec .ri svg{width:19px;height:19px}
.rec .rm{flex:1;min-width:0}
.rec .rm b{display:block;font-size:14.5px}
.rec .rm span{font-size:12.5px;color:var(--muted)}
.rec .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.rec .amt.in{color:var(--green)} .rec .amt.out{color:var(--rust)}
.rec button.x{border:0;background:none;color:var(--muted);padding:4px;width:30px;height:30px}
.rec button.x svg{width:18px;height:18px}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.typegrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.typegrid button svg{width:22px;height:22px}
.typegrid button[aria-pressed="true"]{border-color:var(--green);background:var(--surface-2)}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=number],input[type=date],input[type=tel],input[type=password]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-size:19px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--green)}
.expert{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.expert .eh{display:flex;gap:12px;align-items:center}
.expert .av{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;flex:none}
.expert b{font-family:var(--display);font-size:15px}
.expert .phone{font-family:var(--body);font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.badge-v{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--green);background:var(--surface-2);border-radius:20px;padding:2px 8px}
.badge-v svg{width:13px;height:13px}
.reply{border-left:4px solid var(--green);background:var(--surface);border-radius:0 14px 14px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.reply .who{font-size:12.5px;color:var(--muted)}
.guide-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink)}
.guide-card .gi{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden}
.guide-card .gi svg{width:100%;height:100%;display:block}
.guide-card b{font-family:var(--display);font-size:14.5px;display:block}
.guide-card span{font-size:12.5px;color:var(--muted)}
.guide-hero{border-radius:20px;overflow:hidden}
.guide-hero svg{display:block;width:100%;height:auto}
.gsteps{counter-reset:g;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.gsteps li{counter-increment:g;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.gsteps li::before{content:counter(g);flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.src-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.src-tag.ai{background:var(--sky-soft);color:var(--sky)}
.src-tag.guide{background:var(--surface-2);color:var(--green)}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--rust);border-color:var(--rust);color:#fff}
.msg-tools{display:flex;gap:6px;margin-top:6px}
.msg-tools button{border:0;background:var(--surface-2);color:var(--ink);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.msg-tools button svg{width:14px;height:14px}
.watch-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.watch-row:first-child{border-top:0}
.watch-row .wc{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px}
.wc.now{background:var(--amber-soft);color:#9A5E0B}
.wc.later{background:var(--surface-2);color:var(--muted)}
.practice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.practice summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px}
.practice summary::-webkit-details-marker{display:none}
.practice summary .pi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.practice summary .pi svg{width:20px;height:20px}
.practice summary b{font-family:var(--display);font-size:14.5px}
.practice .pb{padding:0 14px 14px}
.badge-dot{display:inline-flex;min-width:18px;height:18px;border-radius:9px;background:var(--rust);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;padding:0 5px;position:absolute;top:4px;right:calc(50% - 22px)}
.nav a{position:relative}
.coming{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.coming:first-child{border-top:0}
.coming .d{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0;font-family:var(--display);line-height:1.1}
.coming .d b{display:block;font-size:17px}
.coming .d span{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.coming.due .d{background:var(--amber-soft)}
.coming .t{flex:1;min-width:0;font-size:14px}
.coming .t span{display:block;font-size:12px;color:var(--muted)}
.ticket{font-family:var(--display);font-weight:700;letter-spacing:.06em}
.empty{text-align:center;color:var(--muted);padding:18px 10px;font-size:14px}

/* ---------- staff console & dashboard (wide screens) ---------- */
.console{max-width:1180px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.console .top{position:static}
.console-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.inbox{display:flex;flex-direction:column;gap:6px}
.inbox button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.inbox button[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--surface-2)}
.inbox button:focus-visible{outline:3px solid var(--amber)}
.inbox .mid{flex:1;min-width:0}
.inbox .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.inbox .mid span{font-size:12px;color:var(--muted)}
.detail img.photo{width:100%;max-height:360px;object-fit:contain;background:var(--surface-2);border-radius:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th,table.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{font-family:var(--display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
svg.kmap{width:100%;height:auto;display:block}
svg.kmap text{font-family:var(--body);font-size:9px;fill:var(--ink)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.filters select{width:auto;min-width:150px}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.cty-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.cty-chips .chip{font-size:12.5px;padding:5px 10px}

.ico{width:22px;height:22px;flex:none;color:var(--green)}
.note .ico{color:inherit}
.console a,.detail a{color:var(--green)}

/* demo */
.demo-chip{border:0;background:var(--amber);color:#17462F;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:5px 10px;flex:none}
.top .wrap{flex-wrap:wrap}
.staff-head{max-width:1180px;margin:0 auto}
.staff-head .lang{margin-left:auto}
.staff-head .lang button{white-space:nowrap}
.demo-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.demo-card b{font-family:var(--display);font-size:15px}
.demo-card p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.cred{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.cred code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:13.5px;user-select:all}
.cred .btn{min-height:32px;padding:4px 10px;font-size:12.5px}
@media (max-width:520px){.staff-head .lang{margin-left:0;width:100%;justify-content:space-between}}

  if (hot.length) add('heat', hot.some(d => d.tmax >= 35) ? 'warning' : 'watch', `Hot days ahead (up to ${Math.max(...hot.map(d => d.tmax))}°C)`, 'Give animals shade and plenty of clean water, water crops early in the morning, and mulch to keep soil moist.', hot[0].date);
  const next7 = sum(days.map(d => d.rain)), last14 = sum(past.slice(-14).map(d => d.rain));
  if (next7 < 5 && last14 < 10) add('dry_spell', 'watch', 'Dry spell: little rain recently or expected', `Only ${Math.round(last14)} mm in the last 14 days and about ${Math.round(next7)} mm expected this week. Conserve soil moisture, harvest any rainwater, and plan feed and water for animals.`);
  const windy = days.find(d => d.wind >= 40);
  if (windy) add('wind', 'watch', `Strong wind on ${DAYNAME(windy.date)}`, `Gusts near ${Math.round(windy.wind)} km/h. Do not spray that day, and secure greenhouses and roofs.`, windy.date);
  if (days.filter(d => d.humidity >= 80 && d.rain >= 1).length >= 3) add('humid', 'watch', 'Wet, humid days favour plant diseases', 'Fungal diseases such as late blight in tomatoes and potatoes spread fast in this weather. Scout crops every 2–3 days and remove infected leaves.');
  return alerts;
}
function apiWeather(q){
  const lat = Number(q.lat), lon = Number(q.lon);
  if (!(lat > -6 && lat < 6 && lon > 32 && lon < 43)) return [400, { error: 'bad_location' }];
  const today = new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
  const R = rng(lat.toFixed(1) + lon.toFixed(1) + today);
  const dry = lat > 1 || lon > 38.5;                       // north and east are drier
  const m = new Date().getMonth(), wet = [2,3,4,9,10,11].includes(m);
  const base = 26 + (dry ? 5 : 0) - (lat > -1.5 && lat < 0.5 && lon > 35.5 && lon < 37.5 ? 3 : 0);
  const mk = (i, future) => {
    const d = new Date(Date.now() + (i * 864e5) + 3 * 3600e3).toISOString().slice(0, 10);
    const chance = (wet ? .55 : .2) * (dry ? .45 : 1);
    const r = R() < chance ? Math.round((R() * (wet ? 22 : 8) + (R() < .12 && wet ? 25 : 0)) * 10) / 10 : 0;
    return { date: d, code: r >= 10 ? 63 : r > 0 ? 80 : R() < .5 ? 1 : 2, tmax: Math.round(base + R() * 4 - (r > 5 ? 2 : 0)), tmin: Math.round(base - 11 + R() * 3), rain: r, prob: r > 0 ? Math.round(55 + R() * 40) : Math.round(R() * 30), wind: Math.round(10 + R() * 18), humidity: Math.round((r > 0 ? 78 : 58) + R() * 12) };
  };
  const past = Array.from({ length: 30 }, (_, k) => mk(k - 30)), days = Array.from({ length: 7 }, (_, k) => mk(k));
  if (wet && !dry) { days[2].rain = 34.5; days[2].prob = 85; days[2].code = 63; days[2].humidity = 88; days[3].rain = Math.max(days[3].rain, 6); days[3].humidity = 86; days[1].humidity = 84; days[1].rain = Math.max(days[1].rain, 2); }
  const lyTotal = Math.round(sum(past.map(p => p.rain)) * (0.7 + R() * 0.8));
  return [200, {
    place: { lat, lon }, updated: new Date().toISOString(), demo: true,
    source: 'Demo weather (sample data). The full app shows the live forecast from Open-Meteo',
    current: { temp: Math.round(base - 3 + R() * 3), humidity: Math.round(60 + R() * 20), wind: Math.round(8 + R() * 10), code: days[0].code },
    days, past30: { rain_total: Math.round(sum(past.map(p => p.rain))), rain_days: past.filter(p => p.rain >= 1).length, tmax_avg: Math.round(sum(past.map(p => p.tmax)) / 30 * 10) / 10, daily: past.map(p => ({ date: p.date, rain: p.rain })), last_year: { rain_total: lyTotal, tmax_avg: base } },
    alerts: buildAlerts(days, past)
  }];
}

/* ---------------- reports & alerts ---------------- */
const norm = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-zÀ-ɏ ]/g, '').trim();
function computeAlerts(rows, now = Date.now()){
  const g = new Map();
  for (const r of rows) {
    if (now - r.at >= 21 * 864e5 || !r.cause || norm(r.cause) === 'unknown' || r.source === 'followup' || (r.source === 'ai' && r.likelihood === 'low')) continue;
    const k = r.county + '|' + r.subject + '|' + norm(r.cause);
    const x = g.get(k) || { county: r.county, subject: r.subject, kind: r.kind, cause: r.cause, count: 0, verified: 0, flagged: 0, first: r.at, last: r.at };
    x.count++; if (r.source === 'expert') x.verified++; if (r.source === 'farmer_flag') x.flagged++;
    x.first = Math.min(x.first, r.at); x.last = Math.max(x.last, r.at); g.set(k, x);
  }
  const out = [];
  for (const x of g.values()) {
    const unusual = x.flagged >= 2;
    if (x.count >= 3 || x.verified >= 1 || unusual) out.push({ ...x, level: x.verified || x.count >= 6 || unusual ? 'warning' : 'watch', reason: x.verified ? 'confirmed by an expert' : unusual ? 'reported as unusual by farmers' : `${x.count} reports in 3 weeks` });
  }
  return out.sort((a, b) => (b.level === 'warning') - (a.level === 'warning') || b.count - a.count).slice(0, 50);
}
async function addReport(r){
  const row = { at: Date.now(), county: pick(r.county, COUNTIES, ''), kind: r.kind === 'livestock' ? 'livestock' : 'crop', subject: pick(r.subject, [...CROPS, ...ANIMALS, 'Not sure'], 'Not sure'),
    cause: clean(r.cause, 80) || 'Unknown', causeType: clean(r.causeType, 30), likelihood: pick(r.likelihood, ['high','medium','low'], ''), severity: pick(r.severity, ['low','moderate','high'], ''),
    source: pick(r.source, ['ai','farmer_flag','expert','followup'], 'ai'), loss: r.loss != null && r.loss !== '' && Number.isFinite(Number(r.loss)) ? Math.max(0, Math.min(100, Math.round(Number(r.loss)))) : null };
  if (!row.county) return null;
  const id = 'r' + Date.now().toString(36) + rid(4);
  await Store.put('reports', id, row);
  return row;
}
async function apiReports(method, q, b, role){
  if (method === 'POST') { if (b?.source === 'expert') return [400, { error: 'bad_request' }]; const row = await addReport(b || {}); return row ? [200, { ok: true }] : [400, { error: 'bad_request' }]; }
  const rows = await Store.all('reports');
  if (q.alerts !== undefined) {
    const county = pick(q.alerts, COUNTIES, ''), all = computeAlerts(rows), by = new Map();
    for (const a of all) { const k = a.subject + '|' + norm(a.cause); const x = by.get(k) || { subject: a.subject, cause: a.cause, counties: new Set(), level: 'watch' }; x.counties.add(a.county); by.set(k, x); }
    return [200, { county: county ? all.filter(a => a.county === county) : [], national: [...by.values()].filter(x => x.counties.size >= 3).map(x => ({ ...x, counties: [...x.counties] })) }];
  }
  if (!role) return [401, { error: 'password_needed' }];
  const days = Math.min(Math.max(Number(q.days) || 90, 1), 730), since = Date.now() - days * 864e5;
  return [200, { reports: rows.filter(r => r.at >= since).sort((a, b) => b.at - a.at), alerts: computeAlerts(rows), total: rows.length }];
}

/* ---------------- cases ---------------- */
const PUB = c => ({ id: c.id, status: c.status, type: c.type, created: c.created, updated: c.updated, reply: c.reply || null });
async function apiCases(method, q, b, role){
  if (method === 'GET') {
    if (q.id) {
      const c = await Store.get('cases', clean(q.id, 16));
      if (!c) return [404, { error: 'not_found' }];
      if (role === 'staff') { const { token, ...rest } = c; return [200, { case: rest }]; }
      if (q.token && q.token === c.token) return [200, { case: PUB(c) }];
      return [404, { error: 'not_found' }];
    }
    if (q.list && role === 'staff') {
      const all = (await Store.all('cases')).filter(c => q.list === 'all' || (q.list === 'answered' ? c.status !== 'open' : c.status === 'open'));
      return [200, { cases: all.sort((a, b) => (q.list === 'answered' ? b.updated - a.updated : b.created - a.created)).map(({ photo, token, ...r }) => ({ ...r, hasPhoto: !!photo })) }];
    }
    return [role ? 400 : 401, { error: role ? 'bad_request' : 'staff_only' }];
  }
  if (!b) return [400, { error: 'bad_request' }];
  if ((b.action || 'create') === 'create') {
    if (b.consent !== true) return [400, { error: 'consent_needed' }];
    const phone = clean(b.contact?.phone, 20).replace(/[^\d+ ]/g, '');
    if (phone.replace(/\D/g, '').length < 9) return [400, { error: 'phone_needed' }];
    const kind = b.kind === 'livestock' ? 'livestock' : 'crop', now = Date.now();
    const photo = typeof b.photo === 'string' && b.photo.length < 200000 ? b.photo : null;
    const c = { id: rid(6), token: rid(16), created: now, updated: now, status: 'open', type: b.type === 'visit' ? 'visit' : 'review', kind,
      subject: kind === 'crop' ? pick(b.subject, [...CROPS, 'Not sure'], 'Not sure') : pick(b.subject, ANIMALS, 'Cattle'), part: clean(b.part, 20), county: pick(b.county, COUNTIES, ''), place: clean(b.place, 80),
      details: { age: clean(b.details?.age, 30), breed: clean(b.details?.breed, 40), signs: (b.details?.signs || []).slice(0, 12).map(s => clean(s, 40)) },
      symptoms: clean(b.symptoms, 1200), note: clean(b.note, 600),
      ai: b.ai ? { headline: clean(b.ai.headline, 200), severity: clean(b.ai.severity, 12), causes: (b.ai.causes || []).slice(0, 3).map(x => ({ name: clean(x?.name, 80), likelihood: clean(x?.likelihood, 8) })) } : null,
      contact: { name: clean(b.contact?.name, 60), phone }, lang: b.lang === 'sw' ? 'sw' : 'en', photo };
    await Store.put('cases', c.id, c);
    return [200, { id: c.id, token: c.token }];
  }
  if (b.action === 'reply') {
    if (role !== 'staff') return [401, { error: 'staff_only' }];
    const c = await Store.get('cases', clean(b.id, 16));
    if (!c) return [404, { error: 'not_found' }];
    c.reply = { text: clean(b.text, 2000), by: clean(b.by, 80), role: clean(b.role, 40), at: Date.now(), confirmedCause: clean(b.confirmedCause, 80), verified: !!b.verified && !!clean(b.confirmedCause, 80) };
    c.status = pick(b.status, ['answered', 'closed', 'open'], 'answered'); c.updated = Date.now();
    if (c.reply.verified && !c.verifiedReported) { await addReport({ county: c.county, kind: c.kind, subject: c.subject, cause: c.reply.confirmedCause, likelihood: 'high', severity: c.ai?.severity || '', source: 'expert' }); c.verifiedReported = true; }
    await Store.put('cases', c.id, c);
    const { token, ...rest } = c; return [200, { case: rest }];
  }
  return [400, { error: 'bad_request' }];
}

/* ---------------- experts ---------------- */
const ROLES = ['Extension officer','Veterinary surgeon','Veterinary paraprofessional','Animal health worker','Agronomist','Crop specialist','Plant doctor'];
async function apiExperts(method, q, b, role){
  if (method === 'GET') {
    const rows = await Store.all('experts');
    if (q.all) return role === 'staff' ? [200, { experts: rows.sort((a, b) => a.name.localeCompare(b.name)) }] : [401, { error: 'staff_only' }];
    const county = pick(q.county, COUNTIES, '');
    return [200, { experts: rows.filter(e => e.verified && (e.counties.includes('All Kenya') || e.counties.includes(county))).map(({ notes, ...p }) => p)
      .sort((a, b) => (b.counties.includes(county)) - (a.counties.includes(county)) || a.name.localeCompare(b.name)) }];
  }
  if (role !== 'staff') return [401, { error: 'staff_only' }];
  if (b?.action === 'save' && b.expert) {
    const x = b.expert;
    const e = { id: clean(x.id, 16) || rid(6), name: clean(x.name, 80), role: pick(x.role, ROLES, 'Extension officer'), org: clean(x.org, 80), phone: clean(x.phone, 20).replace(/[^\d+ ]/g, ''), email: clean(x.email, 80),
      counties: (x.counties || []).filter(c => c === 'All Kenya' || COUNTIES.includes(c)), regBody: clean(x.regBody, 60), regNo: clean(x.regNo, 40), verified: !!x.verified, verifiedBy: clean(x.verifiedBy, 60),
      verifiedAt: x.verified ? (x.verifiedAt || Date.now()) : null, visits: !!x.visits, notes: clean(x.notes, 400) };
    if (!e.name || !e.phone || !e.counties.length) return [400, { error: 'name_phone_county_needed' }];
    await Store.put('experts', e.id, e); return [200, { expert: e }];
  }
  if (b?.action === 'delete' && b.id) { await Store.del('experts', clean(b.id, 16)); return [200, { ok: true }]; }
  return [400, { error: 'bad_request' }];
}

/* ---------------- fetch router ---------------- */
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  const m = url.pathname.match(/\/api\/(ask|weather|cases|experts|reports)$/);
  if (!m) return realFetch(input, init);
  if (init.signal?.aborted) throw new DOMException('Aborted', 'AbortError');
  await Store.ready;
  const method = (init.method || 'GET').toUpperCase();
  const q = Object.fromEntries(url.searchParams);
  let b = null; try { b = init.body ? JSON.parse(init.body) : null; } catch {}
  const hdr = init.headers || {};
  const pw = hdr['X-DuduCare-Staff'] || hdr['x-duducare-staff'] || '';
  const role = pw === STAFF ? 'staff' : pw === VIEWER ? 'viewer' : null;
  let out;
  try {
    out = m[1] === 'ask' ? await apiAsk({ ...b, __signal: init.signal })
      : m[1] === 'weather' ? apiWeather(q)
      : m[1] === 'cases' ? await apiCases(method, q, b, role)
      : m[1] === 'experts' ? await apiExperts(method, q, b, role)
      : await apiReports(method, q, b, role);
  } catch (e) {
    if (e?.name === 'AbortError') throw e;
    console.warn('demo api', e);
    out = [502, { error: 'store_error' }];
  }
  return new Response(JSON.stringify(out[1]), { status: out[0], headers: { 'Content-Type': 'application/json' } });
};

    const d = await use('downloads');
    if (d) { try { await d.save({ filename, data }); return true; } catch { return false; } }
    if (window.claude) return false;
    // standalone website: a normal browser download
    const url = URL.createObjectURL(new Blob([data], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  },
  async reset(){
    try { Object.keys(localStorage).filter(k => k.startsWith('dudu.')).forEach(k => localStorage.removeItem(k)); } catch {}
    try { sessionStorage.clear(); } catch {}
  }
};

async function call(path, { method = 'GET', body, signal } = {}){
  if (navigator.onLine === false) throw { code:'offline' };
  let res;
  try {
    res = await fetch(API_BASE + path, { method, signal, headers: body ? { 'Content-Type':'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    if (e?.name === 'AbortError') throw { code:'cancelled' };
    throw { code:'offline' };
  }
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) throw { code: data?.error || 'server' };
  return data;
}

/* ---------- photos ---------- */
function shrink(dataUrl, max = 1024, q = .8){
  return new Promise(res => {
    if (!dataUrl) return res(null);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { res(c.toDataURL('image/jpeg', q).split(',')[1]); } catch { res(null); }
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}
function thumb(dataUrl){
  return new Promise(res => {
    if (!dataUrl) return res(null);
    const img = new Image();
    img.onload = () => {
      const s = 220, c = document.createElement('canvas'); c.width = s; c.height = s;
      const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
      c.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
      try { res(c.toDataURL('image/jpeg', .72)); } catch { res(null); }
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}

/* ---------- voice: speak questions, listen to answers ---------- */
const voice = {
  async canListen(){
    if (window.DEMO) return false; // microphone is not available inside the demo page
    const SR = plug('SpeechRecognition');
    if (SR) { try { return !!(await SR.available()).available; } catch { return false; } }
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  },
  async listen(){
    const code = lang === 'sw' ? 'sw-KE' : 'en-KE';
    const SR = plug('SpeechRecognition');
    if (SR) {
      try { await SR.requestPermissions(); } catch {}
      const r = await SR.start({ language: code, maxResults: 1, popup: true, partialResults: false, prompt: lang === 'sw' ? 'Ongea sasa' : 'Speak now' });
      return r?.matches?.[0] || '';
    }
    const W = window.SpeechRecognition || window.webkitSpeechRecognition;
    return new Promise((resolve, reject) => {
      const r = new W(); let said = '';
      r.lang = code; r.interimResults = false; r.maxAlternatives = 1;
      r.onresult = e => { said = e.results[0][0].transcript; };
      r.onerror = e => reject(e.error);
      r.onend = () => resolve(said);
      r.start();
    });
  },
  canSpeak(){ return !!(plug('TextToSpeech') || window.speechSynthesis); },
  async speak(text, l = lang){
    const code = l === 'sw' ? 'sw-KE' : 'en-GB';
    const T = plug('TextToSpeech');
    if (T) {
      try { await T.stop(); } catch {}
      try { await T.speak({ text, lang: code, rate: .95 }); } catch { try { await T.speak({ text, lang: 'en-US', rate: .95 }); } catch {} }
      return;
    }
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = code; u.rate = .95;
    speechSynthesis.speak(u);
  },
  stop(){ try { plug('TextToSpeech')?.stop(); } catch {} try { window.speechSynthesis?.cancel(); } catch {} }
};
async function micInto(input, btn){
  if (btn.classList.contains('on')) return;
  btn.classList.add('on');
  try {
    const t = await voice.listen();
    if (t) { input.value = (input.value ? input.value.trim() + ' ' : '') + t; input.dispatchEvent(new Event('input')); }
  } catch { toast(lang === 'sw' ? 'Sikuweza kusikia. Jaribu tena.' : 'Could not hear you. Try again.'); }
  btn.classList.remove('on');
}
async function wireMics(){
  const ok = await voice.canListen();
  $$('[data-mic]').forEach(b => { b.hidden = !ok; b.onclick = () => micInto($(b.dataset.mic), b); });
}

const hashId = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h) % 2147483000 + 1; };
async function remind(key, title, body, iso){
  const N = plug('LocalNotifications');
  if (!N || !iso) return;
  try {
    let p = await N.checkPermissions();
    if (p.display !== 'granted') p = await N.requestPermissions();
    if (p.display !== 'granted') return;
    const at = new Date(iso + 'T07:30:00');
    if (at <= new Date()) return;
    await N.schedule({ notifications: [{ id: hashId(key), title, body, schedule: { at } }] });
  } catch {}
}
async function unremind(key){ try { await plug('LocalNotifications')?.cancel({ notifications: [{ id: hashId(key) }] }); } catch {} }

function farmLoc(){ return profile.lat != null ? [profile.lat, profile.lon] : (D.COUNTIES[profile.county] || D.COUNTIES.Kiambu); }
function nearestCounty(lat, lon){
  let best = null, bd = 1e9;
  for (const [n, [a, b]] of Object.entries(D.COUNTIES)) { const d = (a - lat) ** 2 + (b - lon) ** 2; if (d < bd) { bd = d; best = n; } }
  return best;
}

  if (!force && weather && weather.key === key && Date.now() - weather.at < 3600e3) return weather.data;
  const data = await call(`/api/weather?lat=${lat}&lon=${lon}`);
  weather = { key, at: Date.now(), data }; store.set('weather', weather);
  return data;
}
const WX = c => c == null ? ['cloud','—'] : c === 0 ? ['sun','Sunny'] : c <= 2 ? ['cloudsun','Partly cloudy'] : c === 3 ? ['cloud','Cloudy'] : c <= 48 ? ['fog','Fog'] : c <= 57 ? ['rain','Drizzle'] : c <= 67 ? ['rain','Rain'] : c <= 77 ? ['cloud','Cold'] : c <= 82 ? ['rain','Showers'] : ['storm','Thunderstorms'];
function weatherContext(){
  const w = weather?.data;
  if (!w) return null;
  return { next7Rain: w.days.reduce((s, d) => s + (d.rain || 0), 0), maxTemp: Math.max(...w.days.map(d => d.tmax ?? -99)), past30Rain: w.past30?.rain_total, alerts: (w.alerts || []).map(a => a.title) };
}
function farmRisks(w){
  const out = [];
  const mine = [...profile.crops, ...profile.animals];
  for (const a of w?.alerts || []) {
    const map = D.WEATHER_RISKS[a.type]; if (!map) continue;
    for (const item of mine) if (map[item]) out.push({ item, risk: map[item], because: a.title });
  }
  const merged = new Map();
  for (const r of out) {
    const m = merged.get(r.item) || { item: r.item, risks: [] };
    for (const part of r.risk.split(/,| and /).map(x => x.trim()).filter(Boolean)) if (!m.risks.includes(part)) m.risks.push(part);
    merged.set(r.item, m);
  }
  return [...merged.values()].map(m => ({ item: m.item, risk: m.risks.length > 1 ? m.risks.slice(0, -1).join(', ') + ' and ' + m.risks.at(-1) : m.risks[0] }));
}

}

      age: d.age, breed: d.breed, affected: d.affected, signs: d.kind === 'livestock' ? d.signs : [],
      image, ...farmContext()
    }, ctl.signal);

    current = { id: 'c' + startedAt.toString(36), kind: d.kind, subject: d.subject, part: d.kind === 'crop' ? d.part : '', county: profile.county,

      created: startedAt, followUp: startedAt + fu * 864e5, status: 'open', photo: await thumb(d.preview), photoFull: null, result: r, saved: false };

function wireFollow(c, fresh){
  $('#savecase')?.addEventListener('click', () => {
    c.saved = true;
    const rec = { ...c }; delete rec.saved; delete rec._send;
    cases.unshift(rec); save.cases();
    if (c._send) store.set('send.' + rec.id, c._send);
    remind('case.' + rec.id, 'DuduCare follow-up', `Check your ${subj(rec).toLowerCase()} today: ${rec.result?.headline || ''}`, isoOf(rec.followUp));
    current = rec;
    if (profile.share === true) shareReport(reportFromCase(rec));
    toast('Case saved. Reminder set.');
    location.hash = 'case-' + rec.id;
    if (profile.share === null) setTimeout(() => {
      sheet(`<h2>One more thing</h2>${consentCard()}`);
      wireConsent(ok => { closeSheet(); if (ok) shareReport(reportFromCase(rec)); });
    }, 400);
  });
  $$('#outcomes button').forEach(b => b.onclick = () => {
    const o = b.dataset.o;
    if (c.example) { toast('Example only. Scan your own crop or animal to track it.'); return; }
    const loss = $('#loss')?.value;
    c.history = [...(c.history || []), { at: Date.now(), o, loss }];
    unremind('case.' + c.id);
    if (loss !== '' && loss != null) shareReport(reportFromCase(c, 'followup', { loss: Number(loss) }));
    if (o === 'Better') { c.status = 'resolved'; c.outcome = 'improved after action'; c.resolvedAt = Date.now(); toast('Marked resolved'); }
    else if (o === 'Same') { c.followUp = Date.now() + 5 * 864e5; toast('Next check in 5 days'); }
    else { c.followUp = Date.now() + 2 * 864e5; toast('Next check in 2 days. Consider asking an expert.'); }
    if (c.status !== 'resolved') remind('case.' + c.id, 'DuduCare follow-up', `Check your ${subj(c).toLowerCase()} again today.`, isoOf(c.followUp));
    save.cases(); renderCase(c, false);
  });
  $('#delcase')?.addEventListener('click', () => {
    $('#delconfirm').innerHTML = `<div class="note warn">${ic('warn')}<div>Delete this case from this phone? <div class="row" style="margin-top:8px"><button class="btn primary" id="delyes">Delete</button><button class="btn ghost" id="delno">Keep</button></div></div></div>`;
    $('#delyes').onclick = () => { cases = cases.filter(x => x.id !== c.id); save.cases(); unremind('case.' + c.id); try { localStorage.removeItem('dudu.send.' + c.id); } catch {} toast('Case deleted'); location.hash = 'cases'; };
    $('#delno').onclick = () => $('#delconfirm').innerHTML = '';
  });
}

async function copyText(t){

    const r = c?.result;

      action: 'create', type, consent: $('#x-consent').checked, lang,
      kind: c?.kind || (profile.animals.length && !profile.crops.length ? 'livestock' : 'crop'),
      subject: c ? (D.CROPS.includes(subj(c)) || D.ANIMALS.includes(subj(c)) ? subj(c) : 'Not sure') : (profile.crops[0] || profile.animals[0] || 'Not sure'),
      part: c?.part || '', county: profile.county, place, details: c?.details || {}, symptoms: c?.symptoms || '', note: $('#x-note').value,
      ai: r ? { headline: r.headline, severity: r.severity, causes: (r.possible_causes || []).map(p => ({ name: p.name, likelihood: p.likelihood })) } : null,
      contact: { name, phone }, photo: c ? store.get('send.' + c.id, null) : null
    };
    try {
      const out = await call('/api/cases', { method: 'POST', body: payload });
      tickets.unshift({ id: out.id, token: out.token, type, caseId: c?.id || null, sentAt: Date.now(), status: 'open', phone, subject: payload.subject, reply: null });
      save.tickets(); closeSheet(); toast('Sent. Ticket ' + out.id);
      render();
    } catch (err) {
      $('#x-err').innerHTML = `<div class="note warn">${ic('warn')}<div>${esc(errText(err))}</div></div>`; btn.disabled = false;
    }
  };
}
async function refreshTicket(t){
  if (t.status === 'closed' && t.reply) return false;
  try {
    const { case: s } = await call(`/api/cases?id=${encodeURIComponent(t.id)}&token=${encodeURIComponent(t.token)}`);
    const had = JSON.stringify(t.reply);
    t.status = s.status; t.reply = s.reply;
    if (JSON.stringify(t.reply) !== had) { t.seen = false; save.tickets(); updateBadge(); return true; }
  } catch {}
  return false;
}
async function refreshTickets(){
  let changed = false;
  for (const t of tickets.filter(t => !(t.status === 'closed' && t.reply))) changed = (await refreshTicket(t)) || changed;
  if (changed) { toast('An expert has replied'); if (['home','experts','cases'].includes(route())) render(); }
}

const EXAMPLE_QS = ["Why are the leaves of my maize turning yellow?","How can I manage fall armyworm?","When should I plant beans in my county?","Why is my dairy cow producing less milk?","How can I prepare my farm for the dry season?","How do I improve soil fertility?","How can I reduce post-harvest losses?"];
function vAsk(){
  $('#main').innerHTML = `<div class="view">
    <div><div class="eyebrow">Knowledge Centre</div><h1 class="h1">Ask DuduCare</h1><p class="lede">Ask about crops, animals, soil or weather. Type or speak. Answers come in ${lang === 'sw' ? 'Kiswahili' : 'English'}.</p></div>
    ${subtabs([['ask','Ask'],['guides','Guides'],['safe','Safe Harvest']], 'ask')}
    <div class="chat" id="chat">${chatTurns.length ? '' : `<div class="msg a">Habari! I can help with pests, diseases, planting, soil, livestock care and the season ahead. What would you like to know?</div>`}</div>
    ${chatTurns.length ? '' : `<div class="chips" id="qs">${EXAMPLE_QS.map(q => `<button class="chip">${q}</button>`).join('')}</div>`}
    <form class="composer" id="cform"><textarea id="cin" placeholder="Type your question" aria-label="Your question"></textarea><button type="button" class="iconbtn" data-mic="#cin" aria-label="Speak your question" hidden>${ic('mic')}</button><button class="btn primary" aria-label="Send">${ic('send')}</button></form>
  </div>`;
  const chat = $('#chat');
  const addMsg = (cls, t) => {
    const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = t; chat.append(d);
    if (cls === 'a' && t && voice.canSpeak() && chat.children.length > 1) addTools(d, t);
    return d;
  };
  const addTools = (d, t) => {
    const tools = document.createElement('div'); tools.className = 'msg-tools';
    tools.innerHTML = `<span class="src-tag ai">AI suggestion</span><button>${ic('speaker')}Listen</button>`;
    tools.querySelector('button').onclick = () => voice.speak(t);
    d.append(tools);
  };
  for (const t of chatTurns) addMsg(t.role === 'user' ? 'u' : 'a', t.content);
  $$('#qs .chip').forEach(b => b.onclick = () => { $('#cin').value = b.textContent; $('#cform').requestSubmit(); });
  $('#cin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cform').requestSubmit(); } });
  $('#cform').onsubmit = async e => {
    e.preventDefault();
    const q = $('#cin').value.trim(); if (!q) return;
    $('#cin').value = ''; $('#qs')?.remove();
    chatTurns.push({ role: 'user', content: q }); addMsg('u', q);
    const bubble = addMsg('a wait', 'Thinking…');
    const sendBtn = $('#cform button.primary'); sendBtn.disabled = true;
    try { await getWeather(); } catch {}
    try {
      const { text } = await ask('chat', { turns: chatTurns.slice(-10), ...farmContext() });
      bubble.className = 'msg a'; bubble.textContent = text; if (voice.canSpeak()) addTools(bubble, text);
      chatTurns.push({ role: 'assistant', content: text });
    } catch (err) {
      bubble.className = 'msg a'; bubble.textContent = errText(err);
      chatTurns.pop();
    }
    sendBtn.disabled = false;
    bubble.scrollIntoView({ block: 'nearest' });
  };
  wireMics();
}

function wxTabs(cur){ return subtabs([['weather','Forecast'],['season','Season Watch'],['climate','Climate-smart']], cur); }
function rainChart(daily){
  if (!daily?.length) return '';
  const W = 320, H = 110, pad = 22, max = Math.max(10, ...daily.map(d => d.rain));
  const step = Math.ceil(max / 10) * 10, bw = (W - pad - 4) / daily.length;
  const y = v => H - 18 - (v / step) * (H - 30);
  return `<svg class="rainchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily rainfall in the last 30 days">
    <line x1="${pad}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/><line x1="${pad}" x2="${W}" y1="${y(step)}" y2="${y(step)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${pad - 4}" y="${y(step) + 3}" text-anchor="end">${step}</text><text x="${pad - 4}" y="${y(0) + 3}" text-anchor="end">0</text>
    ${daily.map((d, i) => `<rect x="${pad + 2 + i * bw}" y="${y(d.rain)}" width="${Math.max(2, bw - 2)}" height="${Math.max(0, y(0) - y(d.rain))}" rx="1.5" fill="var(--sky)"><title>${fmtIso(d.date)}: ${d.rain} mm</title></rect>`).join('')}
    <text x="${pad + 2}" y="${H - 4}">${fmtIso(daily[0].date).slice(0, 6)}</text><text x="${W}" y="${H - 4}" text-anchor="end">${fmtIso(daily.at(-1).date).slice(0, 6)}</text>
    <text x="${pad + 4}" y="10">mm</text>
  </svg>`;
}

function periodStart(p){
  const d = new Date();
  if (p === 'month') return [today().slice(0, 8) + '01', 'this month'];
  if (p === 'season') { d.setMonth(d.getMonth() - 4); return [isoOf(d), 'last 4 months']; }
  if (p === 'all') return ['0000', 'all time'];
  return [today().slice(0, 4) + '-01-01', 'this year'];
}
