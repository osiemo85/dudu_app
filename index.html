  const main = { planting: `${r.crop || ''}${r.area ? ' · ' + r.area + ' acres' : ''}`, harvest: `${r.crop || ''} · ${r.qty || 0} ${r.unit || ''}`, input: `${r.inputType || ''}${r.product ? ': ' + r.product : ''}`,
    animal: `${r.event || ''}${r.animal ? ' · ' + r.animal : ''}${r.tag ? ' (' + r.tag + ')' : ''}`, production: `${r.product || ''} · ${r.qty || 0}`, income: r.what || 'Sale',
    expense: `${r.category || ''}${r.what ? ': ' + r.what : ''}`, task: r.title || '' }[r.type] || '';
  const amt = r.type === 'income' ? `<span class="amt in">+${kes(r.amount)}</span>` : costOf(r) ? `<span class="amt out">−${kes(costOf(r))}</span>` : '';
  return `<div class="rec"><span class="ri" style="background:${t.color}">${ic(t.icon)}</span><div class="rm"><b>${esc(main)}</b><span>${t.label} · ${fmtIso(r.date)}${r.type === 'task' ? (r.done ? ' · done' : r.due ? ' · due ' + fmtIso(r.due) : '') : ''}${r.next ? ' · next ' + fmtIso(r.next) : ''}${r.note ? ' · ' + esc(r.note) : ''}</span></div>${amt}<button class="x" data-del="${r.id}" aria-label="Delete record">${ic('trash')}</button></div>`;
}
function field([k, label, kind], val = ''){
  const id = 'r-' + k;
  if (kind === 'crop' || kind === 'animal' || kind === 'croporanimal') {
    const list = kind === 'crop' ? D.CROPS : kind === 'animal' ? D.ANIMALS : [...D.CROPS, ...D.ANIMALS];
    const mine = kind === 'crop' ? profile.crops : kind === 'animal' ? profile.animals : [...profile.crops, ...profile.animals];
    const ordered = [...mine.filter(x => list.includes(x)), ...list.filter(x => !mine.includes(x))];
    return `<label class="f">${label}<select id="${id}">${ordered.map(o => `<option>${esc(o)}</option>`).join('')}</select></label>`;
  }
  if (kind.startsWith('select:')) return `<label class="f">${label}<select id="${id}">${kind.slice(7).split('|').map(o => `<option>${esc(o)}</option>`).join('')}</select></label>`;
  return `<label class="f">${label}<input id="${id}" type="${kind === 'number' ? 'number' : kind === 'date' ? 'date' : 'text'}" ${kind === 'number' ? 'inputmode="decimal" min="0" step="any"' : ''} value="${esc(val)}"></label>`;
}
function recordSheet(type){
  const t = REC[type];
  const el = sheet(`<h2>${ic(t.icon).replace('<svg', '<svg style="width:22px;height:22px;vertical-align:-4px;color:' + t.color + '"')} ${t.label}</h2>
    <form class="form" id="rform">
      ${type === 'task' ? '' : `<label class="f">Date<input type="date" id="r-date" value="${today()}" required></label>`}
      ${t.fields.map(f => field(f)).join('')}
      <label class="f">Note <span class="hint">optional</span><input type="text" id="r-note"></label>
      <div id="r-err"></div>
      <button class="btn primary block">Save record</button>
    </form>`);
  el.querySelector('#rform').onsubmit = e => {
    e.preventDefault();
    const r = { id: uid(), type, date: type === 'task' ? today() : $('#r-date').value || today(), note: $('#r-note').value.trim() };
    for (const [k] of t.fields) r[k] = ($('#r-' + k).value || '').trim();
    if (type === 'task' && !r.title) { $('#r-err').innerHTML = `<div class="note warn">${ic('warn')}<div>Write what needs doing.</div></div>`; return; }
    if ((type === 'income' || type === 'expense') && !(Number(r.amount) > 0)) { $('#r-err').innerHTML = `<div class="note warn">${ic('warn')}<div>Enter the amount in KES.</div></div>`; return; }
    records.push(r); save.records();
    if (type === 'task' && r.due) remind('task.' + r.id, 'DuduCare task', r.title, r.due);
    if (type === 'animal' && r.next) remind('animal.' + r.id, 'DuduCare animal health', `${r.event} due${r.animal ? ' for ' + r.animal : ''}${r.tag ? ' (' + r.tag + ')' : ''}`, r.next);
    closeSheet(); toast('Record saved'); vRecords();
  };
}

/* =================================================================== MY FARM: CASES */
function vCases(){
  const list = allCases();
  $('#main').innerHTML = `<div class="view">
    <div><div class="eyebrow">My Farm</div><h1 class="h1">Crop and animal cases</h1><p class="lede">Every scan you save, with its follow-ups and expert replies.</p></div>
    ${subtabs([['farm','Records'],['cases','Cases'],['experts','Experts'],['profile','Profile']], 'cases')}
    <a class="btn primary block" href="#scan">${ic('camera')}New scan</a>
    <div style="display:flex;flex-direction:column;gap:8px">${list.map(caseRow).join('')}</div>
  </div>`;
}

/* =================================================================== MY FARM: PROFILE */
function vProfile(){
  $('#main').innerHTML = `<div class="view">
    <div><div class="eyebrow">My Farm</div><h1 class="h1">Farm profile</h1><p class="lede">DuduCare uses this for weather, alerts and advice.</p></div>
    ${subtabs([['farm','Records'],['cases','Cases'],['experts','Experts'],['profile','Profile']], 'profile')}
    <div class="card form">
      <label class="f">Your name <span class="hint">optional</span><input type="text" id="p-name" value="${esc(profile.name)}" placeholder="e.g. Wanjiku" autocomplete="name"></label>
      <label class="f">Phone number <span class="hint">only shared when you ask an expert</span><input type="tel" id="p-phone" value="${esc(profile.phone)}" autocomplete="tel"></label>
      <label class="f">County<select id="p-county">${D.COUNTY_NAMES.map(c => `<option ${c === profile.county ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <label class="f">Village, ward or nearest town<input type="text" id="p-place" value="${esc(profile.place)}"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:6px"><b class="small">Farm location for weather</b>
        <div class="row" style="align-items:center"><span class="small muted" id="p-loc" style="flex:2 1 160px">${profile.lat != null ? `Set: ${profile.lat.toFixed(2)}, ${profile.lon.toFixed(2)}` : 'Not set. Using the county town.'}</span>
        <button type="button" class="btn ghost" id="p-gps" style="flex:1 0 auto">${ic('pin')}Use my location</button>${profile.lat != null ? `<button type="button" class="btn line" id="p-clear" style="flex:0 0 auto">Clear</button>` : ''}</div></div>
      <label class="f">Farm size (acres)<input type="number" id="p-size" inputmode="decimal" min="0" step="any" value="${esc(profile.farmSize)}"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:6px"><b class="small">Crops you grow</b><div class="chips" id="p-crops">${D.CROPS.map(c => `<button type="button" class="chip" aria-pressed="${profile.crops.includes(c)}" data-c="${c}">${c}</button>`).join('')}</div></div>
      <div class="f" style="display:flex;flex-direction:column;gap:6px"><b class="small">Animals you keep, and how many</b>
        <div class="form">${D.ANIMALS.map(a => `<div style="display:flex;gap:10px;align-items:center"><label class="check" style="flex:1"><input type="checkbox" data-a="${a}" ${profile.animals.includes(a) ? 'checked' : ''}><span>${a}</span></label><input type="number" min="0" inputmode="numeric" data-n="${a}" value="${esc(profile.herd?.[a] ?? '')}" placeholder="How many" style="width:120px"></div>`).join('')}</div></div>
      <label class="check"><input type="checkbox" id="p-share" ${profile.share === true ? 'checked' : ''}><span><b>Share anonymous reports</b> to help early warning in ${esc(profile.county)}: county, crop or animal and likely problem only. No name, phone or photo.</span></label>
      <button class="btn primary" id="p-save">Save profile</button>
    </div>
    <div class="sec-title"><h2>About DuduCare</h2></div>
    <div class="card small" style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0"><b>From one photo to a protected harvest.</b> DuduCare is an e-minds initiative for smallholder farmers in Kenya.</p>
      <p style="margin:0" class="muted">Your cases, records and profile are saved only on this phone. When you ask for an assessment, your photo and description are sent to DuduCare's AI service to be analysed and are not kept. When you ask an expert, your case, photo, name and phone number are shared with DuduCare's verified experts. Anonymous reports are shared only if you agree.</p>
      <p style="margin:0" class="muted">DuduCare gives preliminary guidance only. It is not a confirmed diagnosis. For serious or unclear problems, consult a qualified agricultural or veterinary professional.</p>
      <p style="margin:0" class="muted">Contact: <span style="user-select:all">emindsconnect@gmail.com</span></p>
    </div>
    <button class="btn line" id="p-wipe" style="align-self:flex-start">${ic('trash')}Delete all my data from this phone</button><div id="p-wipe-c"></div>
    <p class="footer-note">DuduCare v1.1 · demo</p>
  </div>`;
  $$('#p-crops .chip').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
  $('#p-gps').onclick = () => {
    if (!navigator.geolocation) return toast('Location is not available on this device.');
    $('#p-loc').textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(pos => {
      profile.lat = Math.round(pos.coords.latitude * 100) / 100; profile.lon = Math.round(pos.coords.longitude * 100) / 100;
      const near = nearestCounty(profile.lat, profile.lon); if (near) { profile.county = near; $('#p-county').value = near; }
      save.profile(); weather = null; toast('Location saved'); vProfile();
    }, () => { $('#p-loc').textContent = 'Could not get your location. Allow location access and try again.'; }, { timeout: 15000, maximumAge: 600000 });
  };
  $('#p-clear')?.addEventListener('click', () => { profile.lat = profile.lon = null; save.profile(); weather = null; vProfile(); });
  $('#p-save').onclick = () => {
    const animals = $$('[data-a]').filter(c => c.checked).map(c => c.dataset.a);
    const herd = {}; $$('[data-n]').forEach(i => { if (i.value !== '') herd[i.dataset.n] = Number(i.value); });
    const county = $('#p-county').value;
    if (county !== profile.county && profile.lat != null && nearestCounty(profile.lat, profile.lon) !== county) { profile.lat = profile.lon = null; }
    Object.assign(profile, { name: $('#p-name').value.trim(), phone: $('#p-phone').value.trim(), county, place: $('#p-place').value.trim(),
      farmSize: $('#p-size').value, crops: $$('#p-crops .chip[aria-pressed="true"]').map(b => b.dataset.c), animals, herd,
      share: $('#p-share').checked ? true : (profile.share === null ? null : false) });
    if (!$('#p-share').checked && profile.share === true) profile.share = false;
    save.profile(); weather = null; pestAlerts = null; toast('Profile saved');
  };
  $('#p-wipe').onclick = () => {
    $('#p-wipe-c').innerHTML = `<div class="note warn">${ic('warn')}<div>This deletes your cases, records, profile and expert tickets from this phone. It cannot be undone.<div class="row" style="margin-top:8px"><button class="btn primary" id="wipe-yes">Delete everything</button><button class="btn ghost" id="wipe-no">Keep my data</button></div></div></div>`;
    $('#wipe-yes').onclick = () => { try { Object.keys(localStorage).filter(k => k.startsWith('dudu.')).forEach(k => localStorage.removeItem(k)); } catch {} location.hash = 'home'; location.reload(); };
    $('#wipe-no').onclick = () => $('#p-wipe-c').innerHTML = '';
  };
}

/* ---------- start ---------- */
render();
if (navigator.onLine !== false) { refreshTickets(); flushPending(); }
window.addEventListener('online', () => { refreshTickets(); flushPending(); });
try { plug('SystemBars')?.setStyle({ style: 'DARK', bar: 'StatusBar' }); } catch {}
if (false) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();

</script>
<script>
/* DuduCare Expert Desk: e-minds staff and partner experts answer farmer cases and manage the expert directory. */
(() => {
const D = window.DUDU;
const API = ((window.DUDUCARE_CONFIG && window.DUDUCARE_CONFIG.apiBase) || '').replace(/\/$/, '');
const ROLES = ['Extension officer','Veterinary surgeon','Veterinary paraprofessional','Animal health worker','Agronomist','Crop specialist','Plant doctor'];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = ts => new Date(ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
let pass = (() => { try { return sessionStorage.getItem('dudu.staff') || ''; } catch { return ''; } })();
let me = (() => { try { return JSON.parse(localStorage.getItem('dudu.staff.me') || '{}'); } catch { return {}; } })();
let view = 'inbox', list = 'open', cases = [], selected = null, experts = [];

async function call(path, opts = {}){
  const r = await fetch(API + path, { method: opts.body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-DuduCare-Staff': pass }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || r.status), { code: d.error, status: r.status });
  return d;
}
const msg = e => e.code === 'staff_only' ? 'That password is not right.' : e.code === 'store_not_configured' ? 'The database is not connected yet. See the setup guide (Upstash on Vercel).' : 'Could not reach the server: ' + (e.code || e.message);

function login(err = ''){
  $('#staff-main').innerHTML = `<form class="login card" id="lf"><h1 class="h1">Expert Desk</h1><p class="muted" style="margin:0">For e-minds staff and DuduCare partner experts.</p>
    <div class="note info"><div>Demo password: <b>demo-expert</b> (filled in for you)</div></div><label class="f">Staff password<input type="password" id="pw" autocomplete="current-password" value="demo-expert" required></label>
    ${err ? `<div class="note warn"><div>${esc(err)}</div></div>` : ''}<button class="btn primary">Sign in</button></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); pass = $('#pw').value; try { await call('/api/cases?list=open'); try { sessionStorage.setItem('dudu.staff', pass); } catch {} show(); } catch (x) { login(msg(x)); } };
}
function setNav(){}

async function show(){
  setNav();
  if (!pass) return login();
  if (view === 'experts') return showExperts();
  $('#staff-main').innerHTML = `<div class="console">
    <div class="console-head"><div><div class="eyebrow">Farmer cases</div><h1 class="h1">Cases waiting for an expert</h1></div>
      <div class="subtabs" style="flex:0 0 auto">${[['open','Waiting'],['answered','Answered'],['all','All']].map(([k, t]) => `<button data-l="${k}" aria-selected="${k === list}">${t}</button>`).join('')}</div></div>
    <div class="split"><div class="inbox" id="inbox"><div class="empty">Loading…</div></div><div id="detail" class="card detail"><div class="empty">Choose a case to read it and reply.</div></div></div></div>`;
  $$('[data-l]').forEach(b => b.onclick = () => { list = b.dataset.l; selected = null; show(); });
  try { cases = (await call('/api/cases?list=' + list)).cases; }
  catch (e) { if (e.status === 401) { pass = ''; return login(msg(e)); } $('#inbox').innerHTML = `<div class="note warn"><div>${esc(msg(e))}</div></div>`; return; }
  $('#inbox').innerHTML = cases.length ? cases.map(c => `<button data-id="${c.id}" aria-current="${c.id === selected}">
      <span class="status ${c.status === 'open' ? 'due' : 'done'}">${c.type === 'visit' ? 'Visit' : 'Review'}</span>
      <span class="mid"><b>${esc(c.subject)} · ${esc(c.county)}${c.place ? ', ' + esc(c.place) : ''}</b><span>${esc(c.ai?.headline || c.symptoms || '')}</span><span> · ${when(c.created)} · ${esc(c.id)}</span></span>
      ${c.ai?.severity === 'high' ? '<span class="pill high">High</span>' : ''}</button>`).join('')
    : `<div class="empty">No cases here.</div>`;
  $$('#inbox [data-id]').forEach(b => b.onclick = () => openCase(b.dataset.id));
  if (selected) openCase(selected);
}

async function openCase(id){
  selected = id;
  $$('#inbox [data-id]').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
  const box = $('#detail'); box.innerHTML = `<div class="empty">Loading case…</div>`;
  let c; try { c = (await call('/api/cases?id=' + encodeURIComponent(id))).case; } catch (e) { box.innerHTML = `<div class="note warn"><div>${esc(msg(e))}</div></div>`; return; }
  const intl = (c.contact?.phone || '').replace(/\s/g, '').replace(/^0/, '+254');
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div><div class="eyebrow">${c.type === 'visit' ? 'Farm visit request' : 'Expert review'} · ticket ${esc(c.id)} · ${when(c.created)}</div>
    <h2 style="font-size:20px">${esc(c.subject)}${c.part ? ' · ' + esc(c.part) : ''} — ${esc(c.county)}${c.place ? ', ' + esc(c.place) : ''}</h2></div>
    ${c.photo ? `<img class="photo" src="data:image/jpeg;base64,${c.photo}" alt="Farmer's photo">` : '<div class="note info"><div>No photo was sent.</div></div>'}
    <dl class="kv"><dt>Farmer</dt><dd>${esc(c.contact?.name || '—')}</dd><dt>Phone</dt><dd><span style="user-select:all">${esc(c.contact?.phone)}</span> · <a href="tel:${esc(intl)}">Call</a> · <a href="https://wa.me/${esc(intl.replace('+', ''))}" target="_blank" rel="noopener">WhatsApp</a></dd>
      <dt>Language</dt><dd>${c.lang === 'sw' ? 'Kiswahili' : 'English'}</dd>
      ${c.details?.age ? `<dt>Age</dt><dd>${esc(c.details.age)}</dd>` : ''}${c.details?.breed ? `<dt>Breed</dt><dd>${esc(c.details.breed)}</dd>` : ''}
      ${c.details?.signs?.length ? `<dt>Signs</dt><dd>${esc(c.details.signs.join(', '))}</dd>` : ''}</dl>
    ${c.symptoms ? `<div><b class="small">Farmer's description</b><p style="margin:4px 0 0">${esc(c.symptoms)}</p></div>` : ''}
    ${c.note ? `<div><b class="small">Note to expert</b><p style="margin:4px 0 0">${esc(c.note)}</p></div>` : ''}
    ${c.ai ? `<div class="note info" style="flex-direction:column"><b>DuduCare AI (preliminary): ${esc(c.ai.headline)}</b><span>${c.ai.causes.map(x => `${esc(x.name)} (${esc(x.likelihood)})`).join(' · ')} · severity ${esc(c.ai.severity)}</span></div>` : ''}
    ${c.reply ? `<div class="reply"><div class="eyebrow">Current reply</div><div style="white-space:pre-wrap">${esc(c.reply.text)}</div><div class="who">${esc(c.reply.by)}${c.reply.role ? ', ' + esc(c.reply.role) : ''} · ${when(c.reply.at)}${c.reply.verified ? ' · confirmed: ' + esc(c.reply.confirmedCause) : ''}</div></div>` : ''}
    <form class="form" id="rf">
      <div class="two"><label class="f">Your name<input type="text" id="by" value="${esc(me.by || '')}" required></label>
      <label class="f">Your role<select id="role">${ROLES.map(r => `<option ${r === me.role ? 'selected' : ''}>${r}</option>`).join('')}</select></label></div>
      <label class="f">Reply to the farmer <span class="hint">Plain words${c.lang === 'sw' ? ', in Kiswahili if you can' : ''}. Say what to do next and whether you will call or visit.</span><textarea id="txt" style="min-height:140px" required>${esc(c.reply?.text || '')}</textarea></label>
      <label class="f">Confirmed cause <span class="hint">only if you are confident, e.g. after a call or visit</span><input type="text" id="cause" value="${esc(c.reply?.confirmedCause || '')}"></label>
      <label class="check"><input type="checkbox" id="ver" ${c.reply?.verified ? 'checked' : ''}><span>I confirm this as a professional diagnosis. It will be counted as an expert-verified report on the dashboard (no farmer details are shared).</span></label>
      <label class="f">Status<select id="st"><option value="answered">Answered</option><option value="closed">Closed (no further action)</option><option value="open">Keep waiting (more information needed)</option></select></label>
      <div id="rerr"></div><button class="btn primary">Send reply</button></form></div>`;
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    me = { by: $('#by').value.trim(), role: $('#role').value }; try { localStorage.setItem('dudu.staff.me', JSON.stringify(me)); } catch {}
    if ($('#ver').checked && !$('#cause').value.trim()) { $('#rerr').innerHTML = `<div class="note warn"><div>Write the confirmed cause, or untick the confirmation.</div></div>`; return; }
    try {
      await call('/api/cases', { body: { action: 'reply', id: c.id, text: $('#txt').value, by: me.by, role: me.role, confirmedCause: $('#cause').value, verified: $('#ver').checked, status: $('#st').value } });
      selected = null; show();
    } catch (x) { $('#rerr').innerHTML = `<div class="note warn"><div>${esc(msg(x))}</div></div>`; }
  };
}

async function showExperts(edit = null){
  $('#staff-main').innerHTML = `<div class="console"><div class="console-head"><div><div class="eyebrow">Expert Network</div><h1 class="h1">Expert directory</h1><p class="muted" style="margin:0">Only entries marked verified appear in the farmer app.</p></div>
    <button class="btn primary" id="add">Add an expert</button></div>
    <div class="split"><div class="card tbl-wrap" id="elist"><div class="empty">Loading…</div></div><div class="card" id="eform"><div class="empty">Choose an expert to edit, or add a new one.</div></div></div></div>`;
  $('#add').onclick = () => form({});
  try { experts = (await call('/api/experts?all=1')).experts; }
  catch (e) { if (e.status === 401) { pass = ''; return login(msg(e)); } $('#elist').innerHTML = `<div class="note warn"><div>${esc(msg(e))}</div></div>`; return; }
  $('#elist').innerHTML = experts.length ? `<table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Counties</th><th>Status</th></tr></thead><tbody>${experts.map(x => `<tr data-e="${x.id}" style="cursor:pointer"><td><b>${esc(x.name)}</b><br><span class="small muted">${esc(x.phone)}</span></td><td>${esc(x.role)}</td><td>${esc(x.counties.join(', '))}</td><td>${x.verified ? '<span class="badge-v">Verified</span>' : '<span class="status due">Not verified</span>'}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No experts yet.</div>`;
  $$('[data-e]').forEach(r => r.onclick = () => form(experts.find(x => x.id === r.dataset.e)));
  if (edit) form(edit);
}
function form(x){
  const counties = new Set(x.counties || []);
  $('#eform').innerHTML = `<form class="form" id="ef"><h2 style="font-size:18px">${x.id ? 'Edit expert' : 'Add an expert'}</h2>
    <label class="f">Full name<input type="text" id="e-name" value="${esc(x.name)}" required></label>
    <div class="two"><label class="f">Role<select id="e-role">${ROLES.map(r => `<option ${r === x.role ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
    <label class="f">Organisation<input type="text" id="e-org" value="${esc(x.org)}" placeholder="e.g. County Department of Agriculture"></label></div>
    <div class="two"><label class="f">Phone<input type="tel" id="e-phone" value="${esc(x.phone)}" required></label><label class="f">Email<input type="text" id="e-email" value="${esc(x.email)}"></label></div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px"><b class="small">Counties served</b><div class="cty-chips">${['All Kenya', ...D.COUNTY_NAMES].map(c => `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${counties.has(c)}">${esc(c)}</button>`).join('')}</div></div>
    <div class="two"><label class="f">Registration body <span class="hint">e.g. Kenya Veterinary Board</span><input type="text" id="e-body" value="${esc(x.regBody)}"></label><label class="f">Registration number<input type="text" id="e-no" value="${esc(x.regNo)}"></label></div>
    <label class="check"><input type="checkbox" id="e-visits" ${x.visits ? 'checked' : ''}><span>Offers farm visits</span></label>
    <label class="check"><input type="checkbox" id="e-ver" ${x.verified ? 'checked' : ''}><span><b>Verified:</b> I have checked this person's registration or employment and they may be shown to farmers.</span></label>
    <label class="f">Verified by<input type="text" id="e-verby" value="${esc(x.verifiedBy || me.by || '')}"></label>
    <label class="f">Private notes <span class="hint">not shown to farmers</span><input type="text" id="e-notes" value="${esc(x.notes)}"></label>
    <div id="eerr"></div>
    <div class="row"><button class="btn primary">Save</button>${x.id ? '<button type="button" class="btn line" id="e-del">Remove</button>' : ''}</div></form>`;
  $$('#eform .chip').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
  $('#ef').onsubmit = async e => {
    e.preventDefault();
    const expert = { id: x.id, name: $('#e-name').value, role: $('#e-role').value, org: $('#e-org').value, phone: $('#e-phone').value, email: $('#e-email').value,
      counties: $$('#eform .chip[aria-pressed="true"]').map(b => b.dataset.c), regBody: $('#e-body').value, regNo: $('#e-no').value,
      visits: $('#e-visits').checked, verified: $('#e-ver').checked, verifiedBy: $('#e-verby').value, verifiedAt: x.verifiedAt, notes: $('#e-notes').value };
    try { const out = await call('/api/experts', { body: { action: 'save', expert } }); showExperts(out.expert); }
    catch (er) { $('#eerr').innerHTML = `<div class="note warn"><div>${er.code === 'name_phone_county_needed' ? 'Add a name, phone number and at least one county.' : esc(msg(er))}</div></div>`; }
  };
  $('#e-del')?.addEventListener('click', () => {
    $('#eerr').innerHTML = `<div class="note warn"><div>Remove ${esc(x.name)} from the directory? <div class="row" style="margin-top:8px"><button type="button" class="btn primary" id="dy">Remove</button><button type="button" class="btn ghost" id="dn">Keep</button></div></div></div>`;
    $('#dy').onclick = async () => { try { await call('/api/experts', { body: { action: 'delete', id: x.id } }); showExperts(); } catch (er) { $('#eerr').textContent = msg(er); } };
    $('#dn').onclick = () => $('#eerr').innerHTML = '';
  });
}
window.DESK = { show: v => { if (v) view = v; show(); } };
})();

</script>
<script>
/* DuduCare Food Security Dashboard: anonymous, consent-based reports from farmers, AI assessments and experts. */
(() => {
const D = window.DUDU;
const API = ((window.DUDUCARE_CONFIG && window.DUDUCARE_CONFIG.apiBase) || '').replace(/\/$/, '');
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SRC = { ai: 'AI assessment', farmer_flag: 'Farmer: unusual', expert: 'Expert-verified', followup: 'Follow-up (loss)' };
let pass = (() => { try { return sessionStorage.getItem('dudu.dash') || sessionStorage.getItem('dudu.staff') || ''; } catch { return ''; } })();
let data = null, f = { days: 90, kind: 'all', source: 'all', county: 'all' };

async function load(){
  const r = await fetch(`${API}/api/reports?days=${f.days}`, { headers: { 'X-DuduCare-Staff': pass } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error), { code: d.error, status: r.status });
  return d;
}
const msg = e => e.code === 'password_needed' ? 'That password is not right.' : e.code === 'store_not_configured' ? 'The database is not connected yet. See the setup guide (Upstash on Vercel).' : 'Could not reach the server: ' + (e.code || e.message);

function login(err = ''){
  $('#staff-main').innerHTML = `<form class="login card" id="lf"><h1 class="h1">Food Security Dashboard</h1><p class="muted" style="margin:0">For e-minds, county officers, researchers and partners.</p>
    <div class="note info"><div>Demo password: <b>demo-dashboard</b> (filled in for you)</div></div><label class="f">Dashboard password<input type="password" id="pw" autocomplete="current-password" value="demo-dashboard" required></label>
    ${err ? `<div class="note warn"><div>${esc(err)}</div></div>` : ''}<button class="btn primary">Open dashboard</button></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); pass = $('#pw').value; try { data = await load(); try { sessionStorage.setItem('dudu.dash', pass); } catch {} draw(); } catch (x) { login(msg(x)); } };
}

/* Approximate Kenya outline (lon, lat) — for orientation only */
const OUTLINE = [[34.0,-1.0],[35.5,-1.65],[37.6,-3.0],[37.75,-3.6],[39.2,-4.68],[39.6,-4.1],[39.85,-3.6],[40.15,-3.2],[40.6,-2.55],[41.0,-2.1],[41.56,-1.66],[41.0,-0.87],[41.0,2.78],[41.9,3.95],[40.8,4.25],[39.85,3.84],[39.05,3.52],[38.1,3.6],[36.85,4.45],[35.95,4.62],[35.3,5.0],[34.4,4.6],[33.99,4.22],[34.4,3.7],[34.9,3.0],[35.0,1.95],[34.55,1.12],[34.1,0.46],[33.95,0.1],[34.0,-1.0]];
function kenyaMap(byCounty, alertSet){
  const W = 420, H = 470, lon0 = 33.6, lon1 = 42.2, lat0 = -4.9, lat1 = 5.2;
  const X = lon => 10 + (lon - lon0) / (lon1 - lon0) * (W - 20), Y = lat => 10 + (lat1 - lat) / (lat1 - lat0) * (H - 20);
  const max = Math.max(1, ...Object.values(byCounty));
  const dots = Object.entries(D.COUNTIES).map(([n, [lat, lon]]) => {
    const v = byCounty[n] || 0, r = v ? 4 + 14 * Math.sqrt(v / max) : 2.5, hot = alertSet.has(n);
    return `<g><circle cx="${X(lon).toFixed(1)}" cy="${Y(lat).toFixed(1)}" r="${r.toFixed(1)}" fill="${hot ? 'var(--rust)' : v ? 'var(--green)' : 'var(--line)'}" fill-opacity="${v ? .75 : 1}" stroke="var(--surface)" stroke-width="1"><title>${esc(n)}: ${v} reports${hot ? ' · alert' : ''}</title></circle>${v >= max * .25 ? `<text x="${(X(lon) + r + 2).toFixed(1)}" y="${(Y(lat) + 3).toFixed(1)}">${esc(n)}</text>` : ''}</g>`;
  }).join('');
  return `<svg class="kmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of reports by county">
    <path d="M${OUTLINE.map(([lo, la]) => `${X(lo).toFixed(1)} ${Y(la).toFixed(1)}`).join('L')}Z" fill="var(--surface-2)" stroke="var(--muted)" stroke-width="1"/>
    ${dots}
    <g transform="translate(14 ${H - 46})"><circle cx="6" cy="6" r="6" fill="var(--green)" fill-opacity=".75"/><text x="16" y="9">Reports</text><circle cx="6" cy="24" r="6" fill="var(--rust)" fill-opacity=".75"/><text x="16" y="27">County with an alert</text></g>
    <text x="${W - 10}" y="${H - 6}" text-anchor="end">Outline and positions approximate</text></svg>`;
}
function weekly(rows){
  const now = Date.now(), weeks = Math.max(1, Math.ceil(f.days / 7));
  const counts = Array(weeks).fill(0).map(() => ({ ai: 0, expert: 0, farmer_flag: 0 }));
  for (const r of rows) { const w = Math.floor((now - r.at) / (7 * 864e5)); if (w < weeks && counts[weeks - 1 - w][r.source] != null) counts[weeks - 1 - w][r.source]++; }
  const tot = counts.map(c => c.ai + c.expert + c.farmer_flag), max = Math.max(4, ...tot);
  const W = 520, H = 170, pl = 28, pb = 22, bw = (W - pl - 6) / weeks;
  const Y = v => H - pb - v / max * (H - pb - 10);
  const cols = { ai: 'var(--green)', farmer_flag: 'var(--amber)', expert: 'var(--deep)' };
  const bars = counts.map((c, i) => { let base = 0; return ['ai', 'farmer_flag', 'expert'].map(k => { const y0 = Y(base), y1 = Y(base + c[k]); base += c[k]; return c[k] ? `<rect x="${(pl + 2 + i * bw).toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(2, bw - 3).toFixed(1)}" height="${(y0 - y1).toFixed(1)}" fill="${cols[k]}"><title>${c[k]} ${SRC[k]}</title></rect>` : ''; }).join(''); }).join('');
  const lab = i => { const d = new Date(now - (weeks - 1 - i) * 7 * 864e5); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reports per week">
    <line x1="${pl}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${pl}" x2="${W}" y1="${Y(max)}" y2="${Y(max)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${pl - 4}" y="${Y(max) + 3}" text-anchor="end">${max}</text><text x="${pl - 4}" y="${Y(0) + 3}" text-anchor="end">0</text>${bars}
    <text x="${pl + 2}" y="${H - 6}">${lab(0)}</text><text x="${W - 2}" y="${H - 6}" text-anchor="end">${lab(weeks - 1)}</text></svg>
    <div class="chips small" style="margin-top:6px">${['ai', 'farmer_flag', 'expert'].map(k => `<span style="display:inline-flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:${cols[k]};display:inline-block"></i>${SRC[k]}</span>`).join('')}</div>`;
}
const norm = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, '').trim();
function csv(rows){
  const head = ['date', 'county', 'kind', 'crop_or_animal', 'likely_cause', 'cause_type', 'likelihood', 'severity', 'source', 'loss_percent'];
  const q = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : (v ?? '');
  return [head.join(','), ...rows.map(r => [new Date(r.at).toISOString().slice(0, 10), r.county, r.kind, r.subject, r.cause, r.causeType, r.likelihood, r.severity, SRC[r.source] || r.source, r.loss ?? ''].map(q).join(','))].join('\n');
}

function draw(){
  if (!data) return login();
  let rows = data.reports.filter(r => (f.kind === 'all' || r.kind === f.kind) && (f.source === 'all' || r.source === f.source) && (f.county === 'all' || r.county === f.county));
  const cases = rows.filter(r => r.source !== 'followup');
  const byCounty = {}; cases.forEach(r => byCounty[r.county] = (byCounty[r.county] || 0) + 1);
  const alerts = data.alerts.filter(a => (f.kind === 'all' || a.kind === f.kind) && (f.county === 'all' || a.county === f.county));
  const alertSet = new Set(alerts.map(a => a.county));
  const top = {}; cases.forEach(r => { const k = r.subject + '|' + norm(r.cause); (top[k] = top[k] || { subject: r.subject, cause: r.cause, n: 0, counties: new Set(), verified: 0 }); top[k].n++; top[k].counties.add(r.county); if (r.source === 'expert') top[k].verified++; });
  const topList = Object.values(top).sort((a, b) => b.n - a.n).slice(0, 12);
  const losses = rows.filter(r => r.loss != null); const lossBy = {};
  losses.forEach(r => { (lossBy[r.subject] = lossBy[r.subject] || []).push(r.loss); });
  const avgLoss = losses.length ? Math.round(losses.reduce((s, r) => s + r.loss, 0) / losses.length) : null;
  const countyRows = Object.entries(byCounty).sort((a, b) => b[1] - a[1]);
  $('#staff-main').innerHTML = `<div class="console">
    <div class="console-head"><div><div class="eyebrow">Surveillance and analytics</div><h1 class="h1">Crop and livestock health in Kenya</h1>
      <p class="muted" style="margin:0">Anonymous reports from DuduCare users who agreed to share. AI assessments are preliminary; expert-verified reports are confirmed by a professional.</p></div>
      <button class="btn ghost" id="dl">Download CSV</button></div>
    <div class="filters card">
      <label>Period<select id="f-days">${[[30, 'Last 30 days'], [90, 'Last 90 days'], [365, 'Last 12 months']].map(([v, t]) => `<option value="${v}" ${v == f.days ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Type<select id="f-kind"><option value="all">Crops and livestock</option><option value="crop" ${f.kind === 'crop' ? 'selected' : ''}>Crops</option><option value="livestock" ${f.kind === 'livestock' ? 'selected' : ''}>Livestock</option></select></label>
      <label>Source<select id="f-src"><option value="all">All sources</option>${Object.entries(SRC).map(([k, t]) => `<option value="${k}" ${f.source === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>County<select id="f-county"><option value="all">All counties</option>${D.COUNTY_NAMES.map(c => `<option ${f.county === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    </div>
    <div class="kpis">
      <div class="stat"><div class="n">${cases.length}</div><div class="l">Reports</div></div>
      <div class="stat"><div class="n">${Object.keys(byCounty).length}</div><div class="l">Counties reporting</div></div>
      <div class="stat pos"><div class="n">${cases.filter(r => r.source === 'expert').length}</div><div class="l">Expert-verified</div></div>
      <div class="stat"><div class="n">${cases.filter(r => r.source === 'farmer_flag').length}</div><div class="l">Flagged as unusual</div></div>
      <div class="stat ${avgLoss >= 30 ? 'neg' : ''}"><div class="n">${avgLoss == null ? '—' : avgLoss + '%'}</div><div class="l">Average reported loss</div></div>
    </div>
    <div class="grid2">
      <div class="card">${kenyaMap(byCounty, alertSet)}</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card"><h2 style="font-size:16px;margin-bottom:8px">Early-warning alerts</h2>
          ${alerts.length ? `<div class="alerts">${alerts.slice(0, 8).map(a => `<div class="alert-card ${a.level === 'warning' ? 'warning' : 'watch'}"><span class="ai">!</span><div><b>${esc(a.cause)} on ${esc(a.subject)} — ${esc(a.county)}</b><p>${esc(a.reason)} · last ${new Date(a.last).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</p></div></div>`).join('')}</div>` : '<div class="empty">No alerts in the last 3 weeks.</div>'}
          <p class="small muted" style="margin:8px 0 0">An alert starts when one county has 3 or more reports of the same problem in 3 weeks, an expert confirms it, or 2 farmers flag it as unusual. Farmers in that county see it in the app.</p></div>
        <div class="card"><h2 style="font-size:16px;margin-bottom:8px">Reports per week</h2>${weekly(rows)}</div>
      </div>
    </div>
    <div class="grid2">
      <div class="card tbl-wrap"><h2 style="font-size:16px;margin-bottom:8px">Most reported problems</h2>
        ${topList.length ? `<table class="tbl"><thead><tr><th>Problem</th><th>Crop / animal</th><th class="num">Reports</th><th class="num">Counties</th><th class="num">Verified</th></tr></thead><tbody>${topList.map(t => `<tr><td>${esc(t.cause)}</td><td>${esc(t.subject)}</td><td class="num">${t.n}</td><td class="num">${t.counties.size}</td><td class="num">${t.verified}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No reports for these filters.</div>'}</div>
      <div class="card tbl-wrap"><h2 style="font-size:16px;margin-bottom:8px">Reports by county</h2>
        ${countyRows.length ? `<table class="tbl"><thead><tr><th>County</th><th class="num">Reports</th><th>Alert</th></tr></thead><tbody>${countyRows.map(([c, n]) => `<tr><td>${esc(c)}</td><td class="num">${n}</td><td>${alertSet.has(c) ? '<span class="pill high">Alert</span>' : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No reports.</div>'}
        ${Object.keys(lossBy).length ? `<h2 style="font-size:16px;margin:14px 0 8px">Reported losses at follow-up</h2><table class="tbl"><thead><tr><th>Crop / animal</th><th class="num">Follow-ups</th><th class="num">Average loss</th></tr></thead><tbody>${Object.entries(lossBy).map(([s, a]) => `<tr><td>${esc(s)}</td><td class="num">${a.length}</td><td class="num">${Math.round(a.reduce((x, y) => x + y, 0) / a.length)}%</td></tr>`).join('')}</tbody></table>` : ''}</div>
    </div>
    <p class="small muted">Reports contain no names, phone numbers or photos. Data covers DuduCare users only and is not a full census; read trends with care. Total stored reports: ${data.total}.</p>
  </div>`;
  $('#f-days').onchange = async e => { f.days = Number(e.target.value); try { data = await load(); } catch {} draw(); };
  $('#f-kind').onchange = e => { f.kind = e.target.value; draw(); };
  $('#f-src').onchange = e => { f.source = e.target.value; draw(); };
  $('#f-county').onchange = e => { f.county = e.target.value; draw(); };
  $('#dl').onclick = () => {
    window.DEMO.download(`duducare-reports-${new Date().toISOString().slice(0, 10)}.csv`, csv(rows)).then(ok => { if (!ok) $('#dl').textContent = 'Download not available here'; });
  };
}

window.DASH = { start: async () => { if (!pass) return login(); try { data = await load(); draw(); } catch (e) { pass = ''; login(e.status === 401 ? '' : msg(e)); } } };
})();

</script>
<script>
/* Demo hub: switch between the farmer app, Expert Desk and Dashboard; demo passwords; reset. */
(() => {
const $ = s => document.querySelector(s);
const STAFF_ROUTES = ['desk', 'desk-experts', 'dash'];

window.DEMO_ROUTE = v => {
  const staff = STAFF_ROUTES.includes(v);
  $('.app').hidden = staff; $('.nav').hidden = staff; $('#staff').hidden = !staff;
  if (!staff) return false;
  ['nav-inbox', 'nav-experts', 'nav-dash'].forEach(id => $('#' + id).setAttribute('aria-pressed', (id === 'nav-inbox' && v === 'desk') || (id === 'nav-experts' && v === 'desk-experts') || (id === 'nav-dash' && v === 'dash')));
  $('#staff-title').textContent = v === 'dash' ? 'Food Security Dashboard' : 'Expert Desk';
  setTimeout(() => { if (v === 'dash') window.DASH.start(); else window.DESK.show(v === 'desk' ? 'inbox' : 'experts'); }, 0);
  return true;
};
$('#nav-inbox').onclick = () => { location.hash = 'desk'; };
$('#nav-experts').onclick = () => { location.hash = 'desk-experts'; };
$('#nav-dash').onclick = () => { location.hash = 'dash'; };
$('#nav-farmer').onclick = () => { location.hash = 'home'; };

function copy(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1500); };
  navigator.clipboard?.writeText(t).then(done).catch(() => {});
}
function hub(){
  $('#demo-sheet')?.remove();
  const mode = window.DEMO.store.mode;
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'demo-sheet';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="demo-h"><span class="grab"></span>
    <div><div class="eyebrow">DuduCare demo account</div><h2 id="demo-h">From one photo to a protected harvest</h2>
    <p class="muted small" style="margin:6px 0 0">Everything here is sample data for showing DuduCare. Names and phone numbers are made up.</p></div>
    <div class="demo-card"><div><b>1 · Farmer app</b><p>Signed in as <b>Wanjiku</b>, a demo farmer in Kiambu: maize, beans, tomatoes and kale, 4 cows and 30 chickens. She has a tomato case with an expert reply, farm records and reminders.</p></div>
      <button class="btn primary" data-go="home">Use the farmer app</button></div>
    <div class="demo-card"><div><b>2 · Expert Desk</b><p>For extension officers and vets. Answer farmer cases and manage the expert directory.</p>
      <div class="cred">Password <code>${window.DEMO.STAFF}</code><button class="btn ghost" data-copy="${window.DEMO.STAFF}">Copy</button></div></div>
      <button class="btn amber" data-go="desk">Open Expert Desk</button></div>
    <div class="demo-card"><div><b>3 · Food Security Dashboard</b><p>For e-minds, county officers and partners. County reports, early-warning alerts and CSV export.</p>
      <div class="cred">Password <code>${window.DEMO.VIEWER}</code><button class="btn ghost" data-copy="${window.DEMO.VIEWER}">Copy</button></div></div>
      <button class="btn amber" data-go="dash">Open Dashboard</button></div>
    <div class="card small"><b>Try the full journey</b><ol style="margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
      <li>Scan a crop or animal photo, save the case and tap <b>Ask an expert</b>.</li>
      <li>Open the Expert Desk, choose the case and send a reply.</li>
      <li>Back in the farmer app, open the case: the expert's reply is there.</li>
      <li>See county alerts on the Dashboard and the farmer's home screen.</li></ol></div>
    <div class="note info small"><div>
      ${mode === 'shared' ? 'Demo data is shared: cases you send appear in the Expert Desk on any device where you open this link.' : 'Demo data is kept in this browser only.'}
      ${window.claude ? 'AI answers come from Claude when you allow it; otherwise sample answers are shown.' : 'AI answers in this demo are prepared sample answers; the full app uses Claude AI.'} Weather is sample data in the demo; the full app uses the live forecast.</div></div>
    <button class="btn line" id="demo-reset">Reset the demo on this device</button><div id="demo-reset-c"></div>
  </div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.append(bg);
  bg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { bg.remove(); location.hash = b.dataset.go; });
  bg.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, b));
  $('#demo-reset').onclick = () => {
    $('#demo-reset-c').innerHTML = `<div class="note warn"><div>This clears the demo farmer's cases and records on this device and loads fresh sample data.<div class="row" style="margin-top:8px"><button class="btn primary" id="dr-yes">Reset</button><button class="btn ghost" id="dr-no">Cancel</button></div></div></div>`;
    $('#dr-yes').onclick = async () => { await window.DEMO.reset(); location.hash = 'home'; location.reload(); };
    $('#dr-no').onclick = () => $('#demo-reset-c').innerHTML = '';
  };
}
document.querySelectorAll('.demo-chip').forEach(b => b.onclick = hub);
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#demo-sheet')?.remove(); });
window.addEventListener('hashchange', () => $('#demo-sheet')?.remove());

const route = (location.hash.replace('#', '') || 'home');
if (STAFF_ROUTES.includes(route)) window.DEMO_ROUTE(route);
