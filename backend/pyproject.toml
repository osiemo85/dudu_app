[project]
name = "shamba-guide-api"
version = "0.1.0"
description = "FastAPI backend for the Integrated Agricultural Advisory Demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai==2.36.0",
    "openai-agents>=0.17,<0.18",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

